<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Kentsugi Studio — Prompt to 3D</title>
  <desc id="desc">A dark cinematic Kentsugi Studio banner with a purple scene orb, composition grid, and prompt-driven 3D production message.</desc>
  <defs>
    <radialGradient id="bg" cx="76%" cy="8%" r="80%">
      <stop offset="0" stop-color="#37285f"/>
      <stop offset=".42" stop-color="#17131f"/>
      <stop offset="1" stop-color="#0d0b12"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7a55e8"/>
      <stop offset="1" stop-color="#4321b0"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff9565"/>
      <stop offset=".45" stop-color="#8c66f0"/>
      <stop offset="1" stop-color="#5d35d5"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#8d76bd" stroke-opacity=".13"/>
      <circle cx="0" cy="0" r="1.5" fill="#ff9565" fill-opacity=".32"/>
    </pattern>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect x="890" y="-80" width="850" height="700" fill="url(#grid)" opacity=".75" transform="rotate(-11 1315 270)"/>
  <path d="M0 414C250 354 420 462 658 414S1088 326 1600 390V520H0Z" fill="#0b0910" opacity=".72"/>
  <path d="M0 414C250 354 420 462 658 414S1088 326 1600 390" fill="none" stroke="#ff6b35" stroke-opacity=".28" stroke-width="2"/>
  <g transform="translate(104 104)">
    <rect width="76" height="76" rx="22" fill="url(#mark)"/>
    <path d="M23 21h12v22l23-22h17L51 48l25 28H58L38 53l-3 3v20H23Z" fill="#fff"/>
  </g>
  <text x="200" y="157" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="37" font-weight="700" letter-spacing="-1.4">Kentsugi <tspan fill="#b79cff">Studio</tspan></text>
  <text x="108" y="260" fill="#ff9565" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" letter-spacing="3.6">PROMPT-DRIVEN 3D PRODUCTION</text>
  <text x="108" y="332" fill="#fff" font-family="Georgia,Times New Roman,serif" font-size="67" font-weight="400" letter-spacing="-3.3">Describe the shot.</text>
  <text x="108" y="407" fill="#bca6ff" font-family="Georgia,Times New Roman,serif" font-size="67" font-style="italic" letter-spacing="-3.3">We build the scene.</text>
  <text x="111" y="458" fill="#aaa2b4" font-family="Arial,Helvetica,sans-serif" font-size="16" letter-spacing=".15">Semantic objects · deterministic plans · cinematic Blender rendering</text>
  <g transform="translate(1178 255)" filter="url(#glow)">
    <circle r="104" fill="none" stroke="#8b70c2" stroke-opacity=".44" stroke-width="2"/>
    <circle r="76" fill="none" stroke="#8b70c2" stroke-opacity=".2" stroke-width="1" stroke-dasharray="4 9"/>
    <path d="M0-51L42-27L42 27L0 51L-42 27L-42-27Z" fill="#271c42" stroke="#a88cf8" stroke-opacity=".62"/>
    <path d="M0-32L26-17L26 17L0 32L-26 17L-26-17Z" fill="url(#orb)"/>
    <path d="M0-32V32M-26-17L26 17M-26 17L26-17" stroke="#fff" stroke-opacity=".34" stroke-width="1"/>
    <circle cx="0" cy="-51" r="5" fill="#ff9565"/>
    <circle cx="42" cy="27" r="5" fill="#b79cff"/>
    <circle cx="-42" cy="27" r="5" fill="#b79cff"/>
  </g>
  <g fill="#fff" opacity=".72">
    <circle cx="1385" cy="121" r="2"/><circle cx="1450" cy="181" r="3"/><circle cx="1320" cy="403" r="2"/><circle cx="1512" cy="350" r="2"/>
  </g>
</svg>
